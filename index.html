<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="Luma, una tienda de productos para todos los días.">
  <title>Luma | Compras que iluminan tu día</title>
  <script>
    try {
      const saved = JSON.parse(localStorage.getItem("luma_settings_ui") || "{}");
      const mode = saved.theme || "light";
      const dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.textSize = saved.textSize || "normal";
      if (saved.animations === false) document.documentElement.classList.add("settings-no-motion");
    } catch (error) {
      document.documentElement.dataset.theme = "light";
      document.documentElement.dataset.textSize = "normal";
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="settings.js" defer></script>
  <script src="features.js" defer></script>
  <script src="index.js" defer></script>
</head>
<body>
  <div class="announcement">Envío gratis en pedidos mayores a $1,500 <span>·</span> Compras de demostración, sin pagos reales</div>
  <header class="site-header">
    <div class="header-main container">
      <div class="brand-menu-group">
        <a class="brand" href="#home" aria-label="Luma, ir al inicio">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>Luma<span class="brand-period">.</span><small>TIENDA PARA TODOS LOS DÍAS</small></span>
        </a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="navigation-menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span class="menu-notification-indicator" id="menu-notification-indicator" aria-hidden="true" hidden></span>
        </button>
      </div>
      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="search-input">Buscar productos</label>
        <input id="search-input" name="q" type="search" placeholder="¿Qué estás buscando?" autocomplete="off">
        <button type="submit" aria-label="Buscar">⌕</button>
      </form>
      <nav class="header-actions" aria-label="Acciones principales">
        <a class="cart-link" href="#cart" aria-label="Ver carrito">
          <span class="cart-icon" aria-hidden="true">▱</span>
          <span>Carrito</span><span class="cart-count" id="cart-count">0</span>
        </a>
      </nav>
    </div>
    <nav class="category-nav" aria-label="Categorías">
      <div class="container category-inner" id="category-nav"></div>
    </nav>
  </header>
  <div class="menu-backdrop" id="menu-backdrop" hidden></div>
  <aside class="navigation-menu" id="navigation-menu" aria-label="Menú de navegación" aria-hidden="true" inert>
    <div class="navigation-menu-header">
      <h2>Menú</h2>
      <button class="menu-close" id="menu-close" type="button" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="navigation-menu-content" id="navigation-menu-content"></div>
  </aside>
  <main id="app" class="container page-content" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand footer-brand" href="#home"><span class="brand-mark" aria-hidden="true">✦</span><span>Luma<span class="brand-period">.</span></span></a>
      <p>Una tienda de demostración creada para practicar compras en línea.</p>
      <span>Pagos simulados · Sin transacciones reales</span>
    </div>
  </footer>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
